<!doctype html><meta charset="utf-8"><title>video-hfp — the &lt;video&gt; surface</title>
<style>body{background:#111;color:#ddd;font:14px system-ui}video-hfp{width:640px}pre{font:12px ui-monospace,monospace;white-space:pre-wrap}</style>
<!-- the same attributes a <video> would get: no script drives playback -->
<video-hfp id="v" src="clips/A.mp4" autoplay loop loop-start="30" loop-end="90" muted></video-hfp>
<pre id="out">…</pre>
<script type="module">
// listeners first, then the definition: the upgrade fires loadstart at once
const v = document.getElementById('v');
const events = window.__events = [], trace = window.__trace = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
for (const t of ['loadstart', 'durationchange', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'play', 'playing', 'waiting', 'pause', 'ended', 'seeking', 'seeked', 'volumechange', 'emptied', 'error', 'blocked', 'loop', 'switch'])
  v.addEventListener(t, () => events.push(t));
let timeupdates = 0; v.addEventListener('timeupdate', () => timeupdates++);
v.addEventListener('frame', (e) => trace.push([e.clip.name, e.index, e.p, Math.round(v.engine.now * 1000) / 1000, v.engine.stats.clock]));
const q = new URLSearchParams(location.search);
if (q.get('src')) v.setAttribute('src', `clips/${q.get('src')}`);
await import('../src/element.js');
const throws = {};
for (const name of ['srcObject', 'mediaKeys']) { try { v[name] = 2; throws[name] = null; } catch (e) { throws[name] = e.name; } }
// playbackRate is real: it takes a value and gives it back; out of range throws; 1 again before the loop is measured
let rateWorks = null; try { v.playbackRate = 2; rateWorks = v.playbackRate === 2; v.playbackRate = 1; } catch (e) { rateWorks = e.name; }
let rateRange = null; try { v.playbackRate = 9; rateRange = 'no throw'; } catch (e) { rateRange = e.name; }
throws.playbackRate = null; throws.defaultPlaybackRate = null;
try { v.addTextTrack('subtitles'); throws.addTextTrack = null; } catch (e) { throws.addTextTrack = e.name; }
throws.requestPictureInPicture = await v.requestPictureInPicture().then(() => null, (e) => e.name);
await new Promise((r) => setTimeout(r, 4000));
const probe = { done: true, rate: v.playbackRate, rateWorks, rateRange, events: events.slice(), timeupdates, trace: trace.slice(), throws, paused: v.paused, duration: v.duration, currentTime: v.currentTime, currentFrame: v.currentFrame, frameRate: v.frameRate, frameCount: v.frameCount, readyState: v.readyState, videoWidth: v.videoWidth, videoHeight: v.videoHeight, muted: v.muted, loop: v.loop, size: [v.getBoundingClientRect().width, v.getBoundingClientRect().height] };
// pause, seek while paused, resume: the events a <video> would fire
v.pause(); events.length = 0;
v.seek(10);
await new Promise((r) => setTimeout(r, 800));
probe.afterSeekPaused = { events: events.slice(), currentFrame: v.currentFrame, paused: v.paused };
events.length = 0; const mark = trace.length; await v.play(); await new Promise((r) => setTimeout(r, 600));
probe.afterResume = { events: events.slice(), paused: v.paused, firstFrames: trace.slice(mark, mark + 4).map((e) => e[1]) };
v.pause();
// the controls bar: on with the attribute, its buttons drive the element, the scrubber seeks on release
v.setAttribute('controls', '');
await new Promise((r) => setTimeout(r, 100));
const bar = v.shadowRoot.querySelector('.hfp-controls');
const ctl = { present: !!bar && !bar.hidden, playLabelPaused: bar?.querySelector('.hfp-play')?.getAttribute('aria-label') };
bar.querySelector('.hfp-play').click(); await new Promise((r) => setTimeout(r, 700));
ctl.playsOnClick = !v.paused; ctl.playLabelPlaying = bar.querySelector('.hfp-play').getAttribute('aria-label'); ctl.hiddenWhilePlaying = bar.classList.contains('hfp-away');
bar.querySelector('.hfp-play').click(); await new Promise((r) => setTimeout(r, 300));
ctl.pausesOnClick = v.paused;
const sc = bar.querySelector('.hfp-scrub'); sc.value = '42'; sc.dispatchEvent(new Event('pointerdown')); sc.dispatchEvent(new Event('input')); sc.dispatchEvent(new Event('change'));
await new Promise((r) => setTimeout(r, 800));
ctl.scrubSeeks = v.currentFrame; ctl.scrubMax = Number(sc.max); ctl.timeLabel = bar.querySelector('.hfp-cur').textContent;
bar.querySelector('.hfp-mute').click(); ctl.muteToggles = v.muted === false || v.muted === true; ctl.mutedAfter = v.muted; bar.querySelector('.hfp-mute').click();
// one set of buttons, the page picks the subset: the 10 s skips by default, the single-frame buttons with controlslist="framestep"
const shown = (sel) => getComputedStyle(bar.querySelector(sel)).display !== 'none';
ctl.defaultSet = { skip: shown('.hfp-back') && shown('.hfp-fwd'), step: shown('.hfp-prev') || shown('.hfp-next') };
bar.querySelector('.hfp-fwd').click(); await sleep(600); ctl.fwd10 = v.currentFrame;
bar.querySelector('.hfp-back').click(); await sleep(600); ctl.back10 = v.currentFrame;
v.setAttribute('controlslist', 'framestep'); ctl.framestepSet = { skip: shown('.hfp-back') && shown('.hfp-fwd'), step: shown('.hfp-prev') && shown('.hfp-next') };
bar.querySelector('.hfp-next').click(); await sleep(500); ctl.nextFrame = v.currentFrame;
v.setAttribute('controlslist', 'noskip framestep'); ctl.noskipSet = { skip: shown('.hfp-back') || shown('.hfp-fwd'), step: shown('.hfp-prev') };
v.setAttribute('controlslist', 'nofullscreen'); ctl.noFullscreen = !shown('.hfp-fs');
probe.controls = ctl;
// removal: like a <video>, the element pauses when it leaves the document, and it releases its engine; a move is not a removal
const rm = {};
await v.play(); await sleep(600);
let at = trace.length;
document.body.appendChild(v);   // a move: out and straight back in
await sleep(500);
rm.moveKeepsPlaying = !v.paused && trace.length > at;
const ctx = v.engine.audioContext;
v.remove();
await sleep(50);
rm.pausedOnRemoval = v.paused;
at = trace.length;
await sleep(500);
rm.framesAfterRemoval = trace.length - at;
rm.contextState = ctx.state;   // closed once the engine is released
document.body.prepend(v);
at = trace.length;
await v.play(); await sleep(800);
rm.replays = !v.paused && trace.length - at > 5;
rm.freshEngine = v.engine.audioContext !== ctx;
// a pause() while play() is still opening wins: that play() rejects with AbortError and nothing starts
v.pause(); at = trace.length;
const pending = v.play(); v.pause();
rm.pauseAbortsPlay = await pending.then(() => 'resolved', (e) => e.name);
await sleep(400);
rm.pausedAfterAbort = v.paused; rm.framesAfterAbort = trace.length - at;
probe.removal = rm;
window.__probe = probe;
document.getElementById('out').textContent = JSON.stringify(probe, null, 1);
</script>
