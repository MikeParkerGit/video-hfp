# Publish to npm from a tag push — no login on any machine. Two ways to let it in:
#   - trusted publishing (no token): on npmjs.com, the package's settings → Trusted publisher →
#     GitHub Actions, repository MikeParkerGit/video-hfp, workflow publish.yml. Needs npm ≥ 11.5 on
#     the runner (the upgrade step below) and `id-token: write` (set).
#   - or the repository secret NPM_TOKEN (a granular access token with publish rights on video-hfp).
# A prerelease version (0.2.0-beta.1) goes out under the `beta` dist-tag, a plain one under `latest`.
# `--provenance` stamps the tarball with this commit and run — the verified link to the repo npm shows.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm ≥ 11.5
      - name: the tag must be the package's version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} is not v$v"; exit 1; }
          echo "TAG=$([[ "$v" == *-* ]] && echo beta || echo latest)" >> "$GITHUB_ENV"
      # the smoke test reads the frame-numbered clips ffmpeg generates (the ci workflow does the same)
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: cache test clips
        uses: actions/cache@v4
        with:
          path: demo/clips
          key: clips-${{ hashFiles('tools/make-test-clips.sh') }}
      - run: test -f demo/clips/A.mp4 || npm run clips
      - run: npm test
      - run: npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
